[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "study-agent"
version = "0.1.0"
description = "多源课程资料 RAG 复习助手"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3",
  "chromadb>=1.0,<2", "pypdf>=5,<7", "python-pptx>=1.0,<2",
  "python-docx>=1.1,<2", "httpx>=0.28,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "reportlab>=4,<5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
